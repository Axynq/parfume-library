<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f8f6f1" />
  <meta name="description" content="A personal collection of fragrances, notes and favorites." />
  <title>ÉCHO — Scent Journal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="#home" aria-label="ÉCHO home"><span class="brand-mark">✳</span><span>ÉCHO<span class="brand-dot">.</span><small>SCENT JOURNAL</small></span></a>
      <div class="sidebar-section-label" data-i18n="explore">EXPLORE</div>
      <nav class="side-nav" aria-label="Main navigation">
        <button class="nav-item active" data-page="home"><span class="nav-icon">⌂</span><span data-i18n="navHome">Overview</span></button>
        <button class="nav-item" data-page="library"><span class="nav-icon">▦</span><span data-i18n="navLibrary">My collection</span></button>
        <button class="nav-item" data-page="top"><span class="nav-icon">♕</span><span data-i18n="navTop">My ranking</span></button>
      </nav>
      <div class="sidebar-bottom"><div class="sidebar-note"><span class="sidebar-note-mark">✻</span><span data-i18n="sidebarQuote">A little space for everything you love to smell.</span></div><div class="sidebar-footer">ÉCHO / © 2026</div></div>
    </aside>
    <div class="content-shell">
      <header class="topbar">
        <div class="breadcrumb"><span data-i18n="journal">MY SCENT JOURNAL</span><span class="breadcrumb-slash">/</span><span id="breadcrumb-page">Overview</span></div>
        <div class="top-actions">
          <button id="language-btn" class="language-btn" aria-label="Switch language">UK <span>⌄</span></button>
          <button id="login-btn" class="outline-btn" data-i18n="signIn">Sign in</button>
          <button id="add-btn" class="primary-btn" hidden><span>＋</span><span data-i18n="addPerfume">Add fragrance</span></button>
        </div>
      </header>
      <main id="main" class="main-content"><div class="loading-state">Loading journal…</div></main>
      <footer class="site-footer">ÉCHO SCENT JOURNAL <span>✳</span> <span data-i18n="footer">A personal archive of beautiful things</span></footer>
    </div>
  </div>
  <nav class="mobile-nav" aria-label="Mobile navigation">
    <button data-page="home" class="active"><span>⌂</span><small data-i18n="navHome">Overview</small></button>
    <button data-page="library"><span>▦</span><small data-i18n="navLibrary">Collection</small></button>
    <button data-page="top"><span>♕</span><small data-i18n="navTop">Ranking</small></button>
  </nav>
  <div id="modal-backdrop" class="modal-backdrop" hidden><section id="modal" class="modal" role="dialog" aria-modal="true" aria-label="Dialog"><button id="modal-close" class="modal-close" aria-label="Close">×</button><div id="modal-content"></div></section></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
